<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jarvis</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #050a16 0%, #010104 75%);
        -webkit-app-region: drag;
    }

    canvas {
        display: block;
    }

    #rotulo {
        position: absolute;
        bottom: 22px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Segoe UI", sans-serif;
        font-size: 12px;
        letter-spacing: 4px;
        color: rgba(150, 190, 255, 0.5);
        z-index: 2;
        text-transform: uppercase;
        pointer-events: none;
    }

    #badge_icone {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 34px;
        height: 34px;
        opacity: 0;
        transform: scale(0.6);
        transition: opacity 0.3s ease, transform 0.3s ease;
        filter: drop-shadow(0 0 6px rgba(120, 170, 255, 0.85));
        z-index: 3;
        pointer-events: none;
    }

    #badge_icone.visivel {
        opacity: 1;
        transform: scale(1);
    }

    #conteudo_icone svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: rgba(205, 228, 255, 0.95);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
</style>
</head>
<body>
    <canvas id="nebulosa"></canvas>
    <div id="rotulo">jarvis</div>
    <div id="badge_icone"><div id="conteudo_icone"></div></div>

<script>
    var ICONES = {
        programa: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="1.5"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="18" x2="12" y2="21"/></svg>',
        site: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="12" x2="21" y2="12"/></svg>',
        midia: '<svg viewBox="0 0 24 24"><circle cx="7" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path d="M10 18V5l10-2v13"/></svg>',
        volume: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M17 8a5 5 0 010 8"/></svg>',
        ia: '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/><line x1="9" y1="2" x2="9" y2="6"/><line x1="15" y1="2" x2="15" y2="6"/><line x1="9" y1="18" x2="9" y2="22"/><line x1="15" y1="18" x2="15" y2="22"/><line x1="2" y1="9" x2="6" y2="9"/><line x1="2" y1="15" x2="6" y2="15"/><line x1="18" y1="9" x2="22" y2="9"/><line x1="18" y1="15" x2="22" y2="15"/></svg>',
        fluxo: '<svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="12" r="2"/><line x1="7" y1="6" x2="17" y2="11"/><line x1="7" y1="18" x2="17" y2="13"/></svg>',
        sistema: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="7.8" y2="7.8"/><line x1="16.2" y1="16.2" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="7.8" y2="16.2"/><line x1="16.2" y1="7.8" x2="19.1" y2="4.9"/></svg>',
        padrao: '<svg viewBox="0 0 24 24"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></svg>'
    };

    var temporizadorIcone = null;

    function mostrarIcone(categoria) {
        var badge = document.getElementById("badge_icone");
        var conteudo = document.getElementById("conteudo_icone");
        conteudo.innerHTML = ICONES[categoria] || ICONES.padrao;
        badge.classList.add("visivel");
        if (temporizadorIcone) clearTimeout(temporizadorIcone);
        temporizadorIcone = setTimeout(function () {
            badge.classList.remove("visivel");
        }, 3500);
    }

    var canvas = document.getElementById("nebulosa");
    var ctx = canvas.getContext("2d");
    var LARGURA = window.innerWidth;
    var ALTURA = window.innerHeight;
    canvas.width = LARGURA;
    canvas.height = ALTURA;

    var centroX = LARGURA / 2;
    var centroY = ALTURA / 2;

    var PALETA = [
        "150, 200, 255",
        "120, 170, 255",
        "100, 140, 240",
        "170, 150, 255",
        "190, 220, 255",
        "80, 120, 220"
    ];

    function amostraGaussiana() {
        var soma = 0;
        for (var i = 0; i < 6; i++) soma += Math.random();
        return (soma / 6 - 0.5) * 2;
    }

    function criarParticulas(quantidade) {
        var lista = [];
        for (var i = 0; i < quantidade; i++) {
            var raioDisco = Math.min(LARGURA, ALTURA) * 0.42;
            var x = centroX + amostraGaussiana() * raioDisco;
            var y = centroY + amostraGaussiana() * raioDisco;
            lista.push({
                x: x,
                y: y,
                origemX: x,
                origemY: y,
                raio: Math.random() * 2.2 + 0.6,
                cor: PALETA[Math.floor(Math.random() * PALETA.length)],
                fase: Math.random() * Math.PI * 2,
                velocidadeFase: Math.random() * 0.02 + 0.008,
                deslocX: Math.random() * 14 - 7,
                deslocY: Math.random() * 14 - 7,
                brilhoBase: Math.random() * 0.5 + 0.35
            });
        }
        return lista;
    }

    var particulas = criarParticulas(180);
    var falando = false;
    var intensidadeFala = 0;

    function iniciarFala() {
        falando = true;
    }

    function pararFala() {
        falando = false;
    }

    function desenhar(tempo) {
        ctx.clearRect(0, 0, LARGURA, ALTURA);

        intensidadeFala += ((falando ? 1 : 0) - intensidadeFala) * 0.08;

        for (var i = 0; i < particulas.length; i++) {
            var p = particulas[i];
            p.fase += p.velocidadeFase * (1 + intensidadeFala * 1.8);

            var oscilacao = Math.sin(p.fase);
            var brilho = p.brilhoBase + oscilacao * 0.3 + intensidadeFala * 0.35;
            brilho = Math.max(0.05, Math.min(1, brilho));

            var raioAtual = p.raio * (1 + intensidadeFala * 0.6 + oscilacao * 0.15);

            var x = p.origemX + Math.sin(tempo * 0.0003 + p.fase) * p.deslocX;
            var y = p.origemY + Math.cos(tempo * 0.00025 + p.fase) * p.deslocY;

            var gradiente = ctx.createRadialGradient(x, y, 0, x, y, raioAtual * 6);
            gradiente.addColorStop(0, "rgba(" + p.cor + ", " + brilho + ")");
            gradiente.addColorStop(0.4, "rgba(" + p.cor + ", " + (brilho * 0.25) + ")");
            gradiente.addColorStop(1, "rgba(" + p.cor + ", 0)");

            ctx.fillStyle = gradiente;
            ctx.beginPath();
            ctx.arc(x, y, raioAtual * 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "rgba(255, 255, 255, " + (brilho * 0.9) + ")";
            ctx.beginPath();
            ctx.arc(x, y, raioAtual * 0.6, 0, Math.PI * 2);
            ctx.fill();
        }

        requestAnimationFrame(desenhar);
    }

    requestAnimationFrame(desenhar);
</script>
</body>
</html>
